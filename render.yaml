services:
  - type: web
    name: kashafdeals-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: TELEGRAM_API_ID
        sync: false          # you fill this in on the Render dashboard
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: DEST_CHANNEL
        value: "@kashafdeals"
      - key: AFFILIATE_TAG
        value: "kashafdeals-21"
      - key: CHANNELS
        value: "EgyptOffersHunter"
        # To add more channels: change to "EgyptOffersHunter,AnotherChannel,ThirdChannel"
